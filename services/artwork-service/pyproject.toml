[project]
name = "artwork-service"
version = "0.1.0"
description = "Metal Craft artwork tracing, nesting and DXF production service"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
    "numpy==2.5.4",
    "opencv-python-headless==5.0.0.93",
    "shapely==2.2.0",
    "ezdxf==1.4.5",
    "pillow==13.0.0",
    "packingsolver==0.1.1218",
    "httpx",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artwork_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
